<!DOCTYPE html>
<html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Election Card • Secure</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8fbff);padding:24px 16px;color:#172033}.box{max-width:650px;margin:auto;background:#fff;border-radius:26px;padding:24px;box-shadow:0 15px 45px rgba(15,35,65,.14)}h1{text-align:center;color:#1769e0;margin:0 0 8px}.demo{text-align:center;color:#c40000;font-weight:800;font-size:13px;margin-bottom:20px}.gate{padding:18px;border-radius:18px;background:#f6f9fd;border:1px solid #dbe6f2;text-align:center}.gate p{margin:0 0 10px;color:#5b6878}.gate input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.gate button,.back{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:16px;font-weight:700}.error{min-height:20px;color:#d00000;font-size:13px;margin-top:8px}.document{display:none;margin-top:20px}.document iframe{width:100%;height:75vh;min-height:500px;border:0;border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.12)}.note{text-align:center;color:#687587;font-size:12px;margin-top:15px}.back{background:#243b53;margin-top:18px}</style></head><body><div class="box"><h1>🗳️ Election Card</h1><div class="demo">DEMO — NOT A GOVERNMENT ID</div><div id="gate" class="gate"><p>🔐 Election Card માટે Document Password જરૂરી છે.</p><input id="password" type="password" autocomplete="off" placeholder="Document password દાખલ કરો"><button id="unlockBtn" onclick="unlock()">Unlock Election Card</button><div id="error" class="error"></div></div><div id="document" class="document"><iframe id="pdf" title="Secure Election Card PDF"></iframe><div class="note">આ PDF private storageમાંથી 5 મિનિટના temporary secure linkથી ખોલાય છે.</div></div><button class="back" onclick="location.href='dashboard.html'">← પાછા જાઓ</button></div><script>
if(sessionStorage.getItem('bharatCardAuthenticated')!=='true')location.replace('index.html');
const URL='https://yjqdohryqddwuuftlrrn.supabase.co';const KEY='sb_publishable_1fp9F-X7NgVRJsPFcr3XoQ_Slx3BedS';
async function unlock(){const p=document.getElementById('password').value,e=document.getElementById('error'),b=document.getElementById('unlockBtn');e.textContent='';if(!p){e.textContent='❌ Password દાખલ કરો';return}b.disabled=true;b.textContent='Checking...';try{const r=await fetch(URL+'/functions/v1/secure-document-access',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({type:'voter',password:p})});const d=await r.json();if(d.ok&&d.signedUrl){document.getElementById('pdf').src=d.signedUrl;document.getElementById('gate').style.display='none';document.getElementById('document').style.display='block';sessionStorage.setItem('voterUnlocked','true')}else e.textContent=d.error==='PDF not uploaded yet'?'📄 Election Card PDF હજુ upload થયેલ નથી.':'❌ ખોટો Document Password'}catch(x){e.textContent='❌ Server connection error'}finally{b.disabled=false;b.textContent='Unlock Election Card'}}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});</script></body></html>
