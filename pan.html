<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAN Card • Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8fbff);padding:24px 16px;color:#172033}.box{max-width:520px;margin:auto;background:#fff;border-radius:26px;padding:24px;box-shadow:0 15px 45px rgba(15,35,65,.14)}h1{text-align:center;color:#1769e0;margin:0 0 8px}.demo{text-align:center;color:#c40000;font-weight:800;font-size:13px;margin-bottom:20px}.gate{padding:18px;border-radius:18px;background:#f6f9fd;border:1px solid #dbe6f2;text-align:center}.gate p{margin:0 0 10px;color:#5b6878}.gate input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.gate button,.back{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:16px;font-weight:700}.error{min-height:20px;color:#d00000;font-size:13px;margin-top:8px}.document{display:none;margin-top:20px}.document img{width:100%;display:block;border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.12)}.note{text-align:center;color:#687587;font-size:12px;margin-top:15px}.back{background:#243b53;margin-top:18px}
</style>
</head><body><div class="box"><h1>💳 PAN Card</h1><div class="demo">DEMO — NOT A GOVERNMENT ID</div><div id="gate" class="gate"><p>🔐 PAN Demo માટે Document Password જરૂરી છે.</p><input id="password" type="password" autocomplete="off" placeholder="Document password દાખલ કરો"><button onclick="unlock()">Unlock Demo PAN</button><div id="error" class="error"></div></div><div id="document" class="document"><img src="pan-demo.svg" alt="Demo PAN Card - Not a Government ID"><div class="note">આ માત્ર demo illustration છે. કોઈ real PAN number અથવા personal details નથી.</div></div><button class="back" onclick="location.href='dashboard.html'">← પાછા જાઓ</button></div>
<script>
if(sessionStorage.getItem('bharatCardAuthenticated')!=='true')location.replace('index.html');
const HASH='59d4af76eccc1834493c2d96bcffb45cda1d284942f8235be67e9360baa77aa7';
async function sha256(text){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function unlock(){const p=document.getElementById('password').value;const ok=(await sha256(p))===HASH;if(ok){sessionStorage.setItem('panUnlocked','true');document.getElementById('gate').style.display='none';document.getElementById('document').style.display='block'}else{sessionStorage.removeItem('panUnlocked');document.getElementById('error').textContent='❌ ખોટો Document Password';}}
if(sessionStorage.getItem('panUnlocked')==='true'){document.getElementById('gate').style.display='none';document.getElementById('document').style.display='block'}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
