<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAN Card - Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 25px 18px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      color: #1769e0;
      margin-bottom: 8px;
    }

    .demo {
      color: #d00000;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .document {
      width: 100%;
      min-height: 280px;
      border: 2px dashed #999;
      border-radius: 15px;
      background: #fafafa;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
      color: #777;
      font-size: 18px;
    }

    .back {
      width: 100%;
      margin-top: 20px;
      padding: 14px;

      border: 0;
      border-radius: 12px;

      background: #1769e0;
      color: white;

      font-size: 17px;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box">

      <h1>💳 PAN Card</h1>

      <div class="demo">
        DEMO — NOT A GOVERNMENT ID
      </div>

      <div class="document">
        <div>
          <strong>Demo PAN Card</strong>
          <br><br>
          અહીં Demo Image આવશે
        </div>
      </div>

      <button class="back" onclick="location.href='dashboard.html'">
        ← પાછા જાઓ
      </button>

      <div class="note">
        આ માત્ર Demo માટેનું પેજ છે.
      </div>

    </div>

  </div>

</body>
</html>
