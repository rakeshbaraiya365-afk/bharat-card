<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bharat Card</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff3e0,#e3f2fd);display:flex;align-items:center;justify-content:center;padding:20px}.login-box{width:100%;max-width:400px;background:#fff;padding:30px 25px;border-radius:25px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.15)}.flag{font-size:55px}h1{margin:10px 0;color:#1769e0}.demo{color:#d00000;font-weight:bold;font-size:13px}.line{border:0;border-top:1px solid #ddd;margin:22px 0}h3{color:#333}input{width:100%;padding:16px;margin:15px 0;border:1px solid #ccc;border-radius:12px;font-size:17px}button{width:100%;padding:16px;border:0;border-radius:12px;background:#1769e0;color:white;font-size:18px;font-weight:bold}.button:active{transform:scale(.98)}.error{min-height:20px;margin-top:10px;color:#d00000;font-size:13px}.footer{margin-top:20px;color:#777;font-size:12px}
</style></head><body><div class="login-box"><div class="flag">🇮🇳</div><h1>Bharat Card</h1><p class="demo">DEMO — NOT A GOVERNMENT ID</p><hr class="line"><h3>🔐 Secure Access</h3><input type="password" id="password" autocomplete="current-password" placeholder="Password દાખલ કરો"><button id="loginBtn" onclick="login()">Login</button><div id="error" class="error"></div><div class="footer">Secure access powered by Supabase</div></div>
<script>
const SUPABASE_URL='https://yjqdohryqddwuuftlrrn.supabase.co';
const SUPABASE_KEY='sb_publishable_1fp9F-X7NgVRJsPFcr3XoQ_Slx3BedS';
async function login(){const password=document.getElementById('password').value;const error=document.getElementById('error');const btn=document.getElementById('loginBtn');error.textContent='';if(!password){error.textContent='❌ Password દાખલ કરો';return}btn.disabled=true;btn.textContent='Checking...';try{const r=await fetch(SUPABASE_URL+'/functions/v1/secure-document-access',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({type:'main',password})});const data=await r.json();if(data.ok){sessionStorage.setItem('bharatCardAuthenticated','true');window.location.href='dashboard.html'}else{sessionStorage.removeItem('bharatCardAuthenticated');error.textContent='❌ ખોટો Password'}}catch(e){error.textContent='❌ Server connection error'}finally{btn.disabled=false;btn.textContent='Login'}}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
