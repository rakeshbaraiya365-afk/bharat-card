<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharat Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff3e0, #e3f2fd);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .flag {
      font-size: 55px;
    }

    h1 {
      margin: 10px 0;
      color: #1769e0;
    }

    .demo {
      color: #d00000;
      font-weight: bold;
      font-size: 13px;
    }

    .line {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 22px 0;
    }

    h3 {
      color: #333;
    }

    input {
      width: 100%;
      padding: 16px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #1769e0;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 20px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="flag">🇮🇳</div>

    <h1>Bharat Card</h1>

    <p class="demo">
      DEMO — NOT A GOVERNMENT ID
    </p>

    <hr class="line">

    <h3>🔐 Secure Access</h3>

    <input
      type="password"
      id="password"
      placeholder="Password દાખલ કરો"
    >

    <button onclick="login()">
      Login
    </button>

    <div class="footer">
      Bharat Card Demo Website
    </div>

  </div>

  <script>
    function login() {
      const password = document.getElementById("password").value;

      if (password === "1234") {
        window.location.href = "dashboard.html";
      } else {
        alert("❌ ખોટો Password");
      }
    }
  </script>

</body>
</html>
