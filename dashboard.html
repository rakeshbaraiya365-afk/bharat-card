<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bharat Card - Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff3e0, #e3f2fd);
      padding: 25px 18px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 25px 20px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 6px 25px rgba(0,0,0,0.12);
      margin-bottom: 25px;
    }

    .flag {
      font-size: 50px;
    }

    h1 {
      margin: 8px 0;
      color: #1769e0;
    }

    .demo {
      color: #d00000;
      font-weight: bold;
      font-size: 13px;
    }

    .title {
      text-align: center;
      color: #333;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 14px 0;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.10);

      display: flex;
      align-items: center;
      gap: 18px;

      cursor: pointer;
    }

    .icon {
      width: 60px;
      height: 60px;
      border-radius: 15px;
      background: #eef4ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
      flex-shrink: 0;
    }

    .card h3 {
      margin: 0 0 6px;
      color: #222;
    }

    .card p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .arrow {
      margin-left: auto;
      font-size: 28px;
      color: #1769e0;
    }

    .logout {
      width: 100%;
      margin-top: 25px;
      padding: 14px;

      border: 0;
      border-radius: 12px;

      background: #555;
      color: white;

      font-size: 16px;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="flag">🇮🇳</div>

      <h1>Bharat Card</h1>

      <div class="demo">
        DEMO — NOT A GOVERNMENT ID
      </div>

    </div>

    <h2 class="title">
      તમારો દસ્તાવેજ પસંદ કરો
    </h2>


    <!-- Aadhaar -->

    <div class="card" onclick="openPage('aadhaar.html')">

      <div class="icon">
        🪪
      </div>

      <div>
        <h3>Aadhaar Card</h3>
        <p>Demo Aadhaar document</p>
      </div>

      <div class="arrow">
        ›
      </div>

    </div>


    <!-- PAN -->

    <div class="card" onclick="openPage('pan.html')">

      <div class="icon">
        💳
      </div>

      <div>
        <h3>PAN Card</h3>
        <p>Demo PAN document</p>
      </div>

      <div class="arrow">
        ›
      </div>

    </div>


    <!-- Election -->

    <div class="card" onclick="openPage('voter.html')">

      <div class="icon">
        🗳️
      </div>

      <div>
        <h3>Election Card</h3>
        <p>Demo Election document</p>
      </div>

      <div class="arrow">
        ›
      </div>

    </div>


    <button class="logout" onclick="logout()">
      🔒 Logout
    </button>


    <div class="footer">
      Bharat Card Demo Website
    </div>

  </div>


  <script>

    function openPage(page) {
      window.location.href = page;
    }

    function logout() {
      window.location.href = "index.html";
    }

  </script>

</body>
</html>
