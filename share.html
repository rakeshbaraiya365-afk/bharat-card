<!DOCTYPE html>
<html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b7a45"><title>Bharat Card • Secure Share</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#eefaf4,#f7fbff);padding:20px 14px;color:#172033}.box{max-width:650px;margin:auto;background:#fff;border-radius:26px;padding:24px;box-shadow:0 15px 45px rgba(15,35,65,.14)}h1{text-align:center;color:#0b7a45;margin:0 0 6px}.sub{text-align:center;color:#687587;font-size:13px;margin-bottom:20px}.demo{text-align:center;color:#c40000;font-weight:800;font-size:12px;margin-bottom:18px}.select,.gate{padding:18px;border-radius:18px;background:#f6f9fd;border:1px solid #dbe6f2}.select h3,.gate h3{margin:0 0 12px;font-size:16px}.doc{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:12px;background:#fff;text-align:left;font-size:15px;font-weight:700;color:#172033;cursor:pointer}.doc.active{border-color:#0b7a45;background:#ecfdf5;color:#086337}.gate{display:none;margin-top:14px}.gate p{margin:0 0 10px;color:#5b6878}.gate input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.gate button,.back{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#0b7a45;color:#fff;font-size:16px;font-weight:700}.error{min-height:20px;color:#d00000;font-size:13px;margin-top:8px}.document{display:none;margin-top:20px}.document iframe{width:100%;height:70vh;min-height:480px;border:0;border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.12)}.note{text-align:center;color:#687587;font-size:12px;margin-top:12px}.back{background:#243b53}</style></head><body><div class="box"><h1>🔐 Bharat Card</h1><div class="sub">Secure document sharing</div><div class="demo">DEMO — NOT A GOVERNMENT ID</div><div id="select" class="select"><h3>કયો Document શેર કરવામાં આવ્યો છે?</h3><button class="doc" data-type="aadhaar" onclick="choose('aadhaar',this)">🪪 Aadhaar Card</button><button class="doc" data-type="pan" onclick="choose('pan',this)">💳 PAN Card</button><button class="doc" data-type="voter" onclick="choose('voter',this)">🗳️ Election Card</button></div><div id="gate" class="gate"><h3 id="title">Document Password</h3><p>આ document નો અલગ password નાખો.</p><input id="password" type="password" autocomplete="off" placeholder="Document password દાખલ કરો"><button id="unlockBtn" onclick="unlock()">🔓 Document ખોલો</button><div id="error" class="error"></div></div><div id="document" class="document"><iframe id="pdf" title="Secure shared PDF"></iframe><div class="note">આ link temporary secure access આપે છે. PDF public GitHub પર મૂકવામાં આવતી નથી.</div></div><button class="back" onclick="location.href='index.html'">← Bharat Card પર પાછા જાઓ</button></div><script>
const URL='https://yjqdohryqddwuuftlrrn.supabase.co';const KEY='sb_publishable_1fp9F-X7NgVRJsPFcr3XoQ_Slx3BedS';let type='';let label='';
function choose(t,el){type=t;label=t==='aadhaar'?'Aadhaar Card':t==='pan'?'PAN Card':'Election Card';document.querySelectorAll('.doc').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('title').textContent=label+' માટે Document Password';document.getElementById('gate').style.display='block';document.getElementById('error').textContent='';document.getElementById('password').value='';document.getElementById('password').focus()}
async function unlock(){const p=document.getElementById('password').value,e=document.getElementById('error'),b=document.getElementById('unlockBtn');e.textContent='';if(!type){e.textContent='❌ પહેલા Document પસંદ કરો';return}if(!p){e.textContent='❌ Password દાખલ કરો';return}b.disabled=true;b.textContent='Checking...';try{const r=await fetch(URL+'/functions/v1/secure-document-access',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({type,password:p})});const d=await r.json();if(d.ok&&d.signedUrl){document.getElementById('pdf').src=d.signedUrl;document.getElementById('select').style.display='none';document.getElementById('gate').style.display='none';document.getElementById('document').style.display='block'}else e.textContent=d.error==='PDF not uploaded yet'?'📄 આ PDF હજુ upload થયેલ નથી.':'❌ ખોટો Document Password'}catch(x){e.textContent='❌ Server connection error'}finally{b.disabled=false;b.textContent='🔓 Document ખોલો'}}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});</script></body></html>
