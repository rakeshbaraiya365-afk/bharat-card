<!DOCTYPE html>
<html lang="gu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Bharat Card • Private Upload</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#f8fafc;background:radial-gradient(circle at 15% 0%,#183b66 0,#0b1728 38%,#050a12 100%);padding:18px 14px}.box{max-width:520px;margin:auto;padding:25px 20px;border:1px solid rgba(255,255,255,.12);background:rgba(9,20,35,.94);border-radius:28px;box-shadow:0 20px 55px rgba(0,0,0,.35)}h1{margin:0;font-size:25px}p{color:#aebed1;font-size:13px;line-height:1.55}.security{padding:12px;border-radius:14px;background:rgba(34,197,94,.08);border:1px solid rgba(74,222,128,.22);color:#bbf7d0;font-size:12px;margin:16px 0}.field{margin-top:15px}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}select,input,button{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#101d30;color:#fff;font-size:15px}input[type=file]{padding:11px}button{margin-top:18px;background:linear-gradient(135deg,#2563eb,#0891b2);font-weight:800;cursor:pointer}button:disabled{opacity:.55}.back{display:block;text-align:center;margin-top:16px;color:#9ec5ed;text-decoration:none;font-size:13px}.status{margin-top:15px;padding:12px;border-radius:13px;display:none;font-size:12px;line-height:1.5}.ok{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(74,222,128,.2);color:#bbf7d0}.err{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(248,113,113,.2);color:#fecaca}</style></head><body><main class="box"><h1>🔐 Private PDF Upload</h1><p>તમારા documentની PDF અહીંથી private storageમાં upload થશે. PDF GitHubમાં મૂકવામાં આવશે નહીં.</p><div class="security">🛡️ Upload access માટે Main Password જરૂરી છે. PDF private bucketમાં રહેશે.</div><div class="field"><label>Document</label><select id="type"><option value="aadhaar">Aadhaar Card</option><option value="pan">PAN Card</option><option value="voter">Election Card</option></select></div><div class="field"><label>Main Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Main password"></div><div class="field"><label>PDF file</label><input id="file" type="file" accept="application/pdf,.pdf"></div><button id="btn" type="button" onclick="upload()">🔒 Secure Upload</button><div id="status" class="status"></div><a class="back" href="dashboard.html">← Dashboard પર પાછા જાઓ</a></main><script>const API='https://yjqdohryqddwuuftlrrn.supabase.co/functions/v1/secure-document-access';const KEY='sb_publishable_1fp9F-X7NgVRJsPFcr3XoQ_Slx3BedS';(function(){if(sessionStorage.getItem('bharatCardAuthenticated')!=='true'){location.replace('index.html')}})();function msg(t,ok){const s=document.getElementById('status');s.textContent=t;s.className='status '+(ok?'ok':'err')}async function upload(){const type=document.getElementById('type').value,pw=document.getElementById('password').value,file=document.getElementById('file').files[0],btn=document.getElementById('btn');if(!pw||!file)return msg('Password અને PDF બંને પસંદ કરો.',false);if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf'))return msg('માત્ર PDF file માન્ય છે.',false);if(file.size>15*1024*1024)return msg('PDF 15 MBથી નાની હોવી જોઈએ.',false);btn.disabled=true;btn.textContent='Uploading…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action:'create_upload_url',type,password:pw})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Authorization failed');const u=await fetch(d.signedUploadUrl,{method:'PUT',headers:{'Content-Type':'application/pdf','x-upsert':'true'},body:file});if(!u.ok)throw new Error('PDF upload failed');msg('✅ PDF સુરક્ષિત રીતે upload થઈ ગઈ.',true);document.getElementById('password').value='';document.getElementById('file').value=''}catch(e){msg('❌ '+e.message,false)}finally{btn.disabled=false;btn.textContent='🔒 Secure Upload'}}</script></body></html>
